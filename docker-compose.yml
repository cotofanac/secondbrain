services:
  secondbrain:
    image: havedreams/secondbrain:latest
    container_name: secondbrain
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PASSCODE=${PASSCODE}
      - PORT=8080
      - DATA_DIR=/app/data
      # Set TZ to your local zone (e.g. Europe/Bucharest) so dates, "today" for
      # habits, and note timestamps match your wall clock. Defaults to Europe/Bucharest. The app calendar zone is editable from Today → Reminders & notifications.
      - TZ=${TZ:-Europe/Bucharest}
      # Initial push-reminder settings (24h HH:MM); edit them in the app afterward. Set either to
      # "off" to disable that reminder. Requires HTTPS and, on iOS, installing
      # the app to the Home Screen; see the README "Reminders" section.
      - HABIT_REMINDER_TIME=${HABIT_REMINDER_TIME:-20:00}
      - TASK_REMINDER_TIME=${TASK_REMINDER_TIME:-09:00}
      - PUSH_SUBJECT=${PUSH_SUBJECT:-secondbrain@example.com}
    volumes:
      # Bind mount: the SQLite database is persisted on the host.
      # The container runs as appuser (UID 1000), so the host directory must be
      # writable by UID 1000, otherwise startup fails with
      # "unable to open database file". Create and chown it once:
      #   mkdir -p data && sudo chown -R 1000:1000 data
      # An absolute host path works too (e.g. /srv/secondbrain/data:/app/data)
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO /dev/null http://localhost:${PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
