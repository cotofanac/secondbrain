    <line x1="-96" y1="59" x2="-32" y2="101" opacity="0.4"/>
    <line x1="96" y1="59" x2="32" y2="101" opacity="0.4"/>
    <line x1="-32" y1="101" x2="32" y2="101" opacity="0.4"/>
    <line x1="-74" y1="-27" x2="74" y2="-27" opacity="0.25"/>
    <line x1="-96" y1="59" x2="96" y2="59" opacity="0.25"/>
