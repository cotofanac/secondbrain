<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="40" fill="#0f0f0f"/>
  <!-- Brain-like network nodes + connections -->
  <g stroke="#6c9bff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(96,96)">
    <!-- Connections -->
    <line x1="0" y1="-32" x2="-28" y2="-10" opacity="0.4"/>
    <line x1="0" y1="-32" x2="28" y2="-10" opacity="0.4"/>
    <line x1="-28" y1="-10" x2="-36" y2="22" opacity="0.4"/>
    <line x1="28" y1="-10" x2="36" y2="22" opacity="0.4"/>
    <line x1="-36" y1="22" x2="-12" y2="38" opacity="0.4"/>
    <line x1="36" y1="22" x2="12" y2="38" opacity="0.4"/>
    <line x1="-12" y1="38" x2="12" y2="38" opacity="0.4"/>
    <line x1="-28" y1="-10" x2="28" y2="-10" opacity="0.25"/>
    <line x1="-36" y1="22" x2="36" y2="22" opacity="0.25"/>
    <line x1="0" y1="-32" x2="-12" y2="38" opacity="0.2"/>
    <line x1="0" y1="-32" x2="12" y2="38" opacity="0.2"/>
  </g>
  <!-- Nodes -->
  <g fill="#6c9bff">
    <circle cx="96" cy="64" r="7"/>
    <circle cx="68" cy="86" r="5.5"/>
    <circle cx="124" cy="86" r="5.5"/>
    <circle cx="60" cy="118" r="5"/>
    <circle cx="132" cy="118" r="5"/>
    <circle cx="84" cy="134" r="4.5"/>
    <circle cx="108" cy="134" r="4.5"/>
  </g>
  <!-- Central glow -->
