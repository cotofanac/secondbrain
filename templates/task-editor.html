<form class="task-editor" id="task-editor" data-project-id="{{.Task.ProjectID}}" tabindex="-1" novalidate>
 <input type="hidden" name="id" value="{{.Task.ID}}">
 <input type="hidden" name="revision" value="{{.Task.Revision}}">
 <input class="task-editor-title" name="text" value="{{.Task.Text}}" maxlength="500" required aria-label="Task" autocomplete="off" enterkeyhint="done">
 <div class="task-editor-bar">
  {{if eq .Task.Category "todo"}}
  {{template "date-chip" .Task.DueDate}}
  <label class="chip{{if .Task.Repeat}} is-set{{end}}" title="Repeat">{{template "icon-repeat"}}<select name="repeat" aria-label="Repeat">{{$r := .Task.Repeat}}<option value="" {{if eq $r ""}}selected{{end}}>No repeat</option><option value="daily" {{if eq $r "daily"}}selected{{end}}>Daily</option><option value="weekly" {{if eq $r "weekly"}}selected{{end}}>Weekly</option><option value="monthly" {{if eq $r "monthly"}}selected{{end}}>Monthly</option><option value="yearly" {{if eq $r "yearly"}}selected{{end}}>Yearly</option></select></label>
  <label class="chip" title="List">{{template "icon-folder"}}<select name="list" aria-label="List">{{range .Lists}}<option value="{{.Value}}" {{if eq .Value $.List}}selected{{end}}>{{.Label}}</option>{{end}}</select></label>
  {{end}}
  <p class="task-save-status" role="status" aria-live="polite"></p>
  <button type="button" class="text-action" data-call="closeTaskEditor">Done</button>
 </div>
</form>
