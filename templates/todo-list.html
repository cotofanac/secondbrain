{{range .Todos}}
<div class="todo-item {{if .Done}}done{{end}}">
    <form hx-post="/todos/toggle" hx-target="#todo-items" hx-swap="innerHTML" class="todo-check">
        <input type="hidden" name="id" value="{{.ID}}">
        <button type="submit" class="check-btn {{if .Done}}checked{{end}}" aria-label="Toggle done">
            <span class="icon-unchecked task-checkmark" aria-hidden="true"></span>
            <span class="icon-checked">{{template "icon-check"}}</span>
        </button>
    </form>
    <span class="todo-text">{{.Text}}</span>
    {{if .DueDate}}
    <span class="todo-date {{if and (not .Done) (isOverdue .DueDate)}}overdue{{end}}">{{formatDate .DueDate}}</span>
    {{end}}
    {{if and (not .Done) (eq $.Category "todo")}}{{$hint := todoArchiveHint .CreatedAt .DueDate}}{{if $hint}}<span class="archive-hint">{{$hint}}</span>{{end}}{{end}}
    <form hx-post="/todos/delete" hx-target="#todo-items" hx-swap="innerHTML" class="todo-del">
        <input type="hidden" name="id" value="{{.ID}}">
        <button type="submit" class="del-btn" aria-label="Delete item">{{template "icon-delete"}}</button>
    </form>
</div>
{{else}}
<div class="empty-state">No items yet</div>
{{end}}
