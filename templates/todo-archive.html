<div class="archive-header">
    <button class="btn btn-sm btn-back" onclick="hideArchive()">
        {{template "icon-back"}}
        Back
    </button>
    <span class="archive-title">Archive</span>
</div>
{{range .Todos}}
<div class="todo-item archived-item">
    <span class="todo-text">{{.Text}}</span>
    {{$ago := todoArchivedAgo .ArchivedAt}}{{if $ago}}<span class="archived-ago">{{$ago}}</span>{{end}}
    {{if .DueDate}}
    <span class="todo-date">{{formatDate .DueDate}}</span>
    {{end}}
    <form hx-post="/todos/restore" hx-target="#todo-items" hx-swap="innerHTML" class="todo-action">
        <input type="hidden" name="id" value="{{.ID}}">
        <button type="submit" class="btn-restore" title="Restore">
            {{template "icon-restore"}}
        </button>
    </form>
    <form hx-post="/todos/permanent-delete" hx-target="#todo-items" hx-swap="innerHTML" class="todo-action" hx-confirm="Delete this item forever? This can't be undone.">
        <input type="hidden" name="id" value="{{.ID}}">
        <button type="submit" class="del-btn" title="Delete forever" aria-label="Delete forever">{{template "icon-delete"}}</button>
    </form>
</div>
{{else}}
<div class="empty-state">Archive is empty</div>
{{end}}
