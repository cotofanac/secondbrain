<div class="detail-heading"><h2>Task details</h2><button class="icon-button" data-call="closeDetail" aria-label="Close details">{{template "icon-close"}}</button></div>
<form id="task-detail-form" class="detail-form" hx-post="/task/save" hx-target="#detail-pane" hx-trigger="input delay:600ms, submit" hx-sync="this:queue last">
 <input type="hidden" name="id" value="{{.Task.ID}}">
 <input type="hidden" name="revision" value="{{.Task.Revision}}">
 <label class="detail-title-field"><span>Task</span><input name="text" value="{{.Task.Text}}" maxlength="500" required></label>
 {{if eq .Task.Category "todo"}}
 <div class="detail-properties">
  <label>Due date<input type="date" name="due_date" value="{{.Task.DueDate}}"></label>
  <label>Repeat<select name="repeat">{{$r := .Task.Repeat}}<option value="" {{if eq $r ""}}selected{{end}}>Never</option><option value="daily" {{if eq $r "daily"}}selected{{end}}>Daily</option><option value="weekly" {{if eq $r "weekly"}}selected{{end}}>Weekly</option><option value="monthly" {{if eq $r "monthly"}}selected{{end}}>Monthly</option><option value="yearly" {{if eq $r "yearly"}}selected{{end}}>Yearly</option></select></label>
  <label>Project<select name="project_id" data-call="filterStageOptions" data-args='["$form"]' data-event="change"><option value="0">No project</option>{{range .Projects}}<option value="{{.ID}}" {{if eq .ID $.Task.ProjectID}}selected{{end}}>{{.Name}}</option>{{end}}</select></label>
  <label>Stage<select name="stage_id"><option value="0">No stage</option>{{range .Projects}}{{$pid:=.ID}}{{range .Stages}}{{if not .Archived}}<option data-project="{{$pid}}" value="{{.ID}}" {{if eq .ID $.Task.StageID}}selected{{end}}>{{.Name}}</option>{{end}}{{end}}{{end}}</select></label>
 </div>
 {{end}}
 <p class="detail-save-status" role="status" aria-live="polite"></p>
</form>
