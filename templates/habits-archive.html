<div class="archive-header">
    <button class="btn btn-sm btn-back" onclick="hideHabitsArchive()">
        {{template "icon-back"}}
        Back
    </button>
    <span class="archive-title">Archived Habits</span>
</div>

{{range .}}
<div class="archive-note-item archived-item">
    <span class="archive-note-title">{{.Name}}</span>
    {{if eq .Period "day"}}
    {{if gt .Total 0}}<span class="archive-habit-count">{{.Total}}d</span>{{end}}
    {{else}}
    <span class="archive-habit-count">{{.Total}}/{{.Target}}</span>
    {{end}}
    <div class="archive-note-actions">
        <form hx-post="/habits/restore" hx-target="#habits-content" hx-swap="innerHTML" class="inline-form">
            <input type="hidden" name="id" value="{{.ID}}">
            <button type="submit" class="btn-restore" title="Restore">
                {{template "icon-restore"}}
            </button>
        </form>
        <form hx-post="/habits/permanent-delete" hx-target="#habits-content" hx-swap="innerHTML" class="inline-form" hx-confirm="Delete this habit forever? Its full history will be lost.">
            <input type="hidden" name="id" value="{{.ID}}">
            <button type="submit" class="del-btn" title="Delete forever" aria-label="Delete forever">{{template "icon-delete"}}</button>
        </form>
    </div>
</div>
{{else}}
<div class="empty-state">No archived habits</div>
{{end}}
