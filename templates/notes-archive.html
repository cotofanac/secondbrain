<div class="archive-header">
    <button class="btn btn-sm btn-back" onclick="hideNotesArchive()">
        {{template "icon-back"}}
        Back
    </button>
    <span class="archive-title">Archived Notes</span>
</div>
{{range .}}
<div class="archive-note-item">
    <span class="archive-note-title">{{.Title}}</span>
    <div class="archive-note-actions">
        <form hx-post="/notes/restore" hx-target="#notes-content" hx-swap="innerHTML" class="inline-form">
            <input type="hidden" name="id" value="{{.ID}}">
            <button type="submit" class="btn-restore" title="Restore">
                {{template "icon-restore"}}
            </button>
        </form>
        <form hx-post="/notes/permanent-delete" hx-target="#notes-content" hx-swap="innerHTML" class="inline-form" hx-confirm="Delete this note forever? This can't be undone.">
            <input type="hidden" name="id" value="{{.ID}}">
            <button type="submit" class="del-btn" title="Delete forever" aria-label="Delete forever">{{template "icon-delete"}}</button>
        </form>
    </div>
</div>
{{else}}
<div class="empty-state">No archived notes</div>
{{end}}
