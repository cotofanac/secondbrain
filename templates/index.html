<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SecondBrain</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="stylesheet" href="/static/style.css?v={{assetVersion}}">
</head>
<body data-timezone="{{.Timezone}}" data-inactivity-timeout-seconds="{{.InactivityTimeoutSeconds}}">
    <div id="app">
    <!-- Top nav: mode switcher -->
    <header class="topbar" id="topbar">
        <span class="topbar-title" id="topbar-title">Tasks</span>
        <span class="topbar-stat" id="topbar-stat"></span>
        <button class="header-action icon-button" onclick="openSearch()" aria-label="Search">{{template "icon-search"}}</button>
        <details class="app-menu"><summary class="icon-button" aria-label="More options">{{template "icon-more"}}</summary><div class="menu-panel"><button class="action-with-icon" onclick="openReview()">{{template "icon-calendar"}}<span>Weekly review</span></button><button class="action-with-icon" onclick="openSettings()">{{template "icon-settings"}}<span>Notifications</span></button></div></details>
        <form method="post" action="/logout" class="logout-form">
            <button type="submit" class="logout-btn" title="Logout" aria-label="Logout">
                {{template "icon-logout"}}
            </button>
        </form>
    </header>

    <!-- Search overlay -->
    <div id="search-overlay" class="search-overlay">
        <div class="search-bar">
            <span class="search-icon">{{template "icon-search"}}</span>
            <input type="text" id="search-input" class="search-input"
                   placeholder="Search tasks, projects and notes…"
                   hx-get="/search" hx-trigger="input changed delay:200ms"
                   hx-target="#search-results" hx-swap="innerHTML"
                   name="q" autocomplete="off">
            <button type="button" class="btn-icon search-close" onclick="closeSearch()" aria-label="Close search">
                {{template "icon-close"}}
            </button>
        </div>
        <div id="search-results" class="search-results"></div>
    </div>

    <main id="todos-view" class="view active"><div class="task-layout"><div id="todo-items">{{template "workspace.html" .Workspace}}</div><aside id="detail-pane" class="detail-pane" aria-label="Details" hidden></aside></div>
    <datalist id="grocery-suggestions">{{range .GrocerySuggestions}}<option value="{{.}}">{{end}}</datalist><datalist id="shopping-suggestions">{{range .ShoppingSuggestions}}<option value="{{.}}">{{end}}</datalist></main>
    <main id="settings-view" class="view"><div id="settings-content"></div></main>
    <main id="review-view" class="view"><div id="review-content"></div></main>

    <!-- Notes view -->
    <main id="notes-view" class="view">
        <div id="notes-content">
            {{template "notes.html" .}}
        </div>
    </main>

    <!-- Habits view -->
    <main id="habits-view" class="view">
        <div id="habits-content">
            {{template "habit-list" .Habits}}
        </div>
    </main>
    </div><!-- #app -->

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <div id="inactivity-warning" class="inactivity-warning" hidden aria-hidden="true">
        <div class="inactivity-sheet" role="dialog" aria-modal="true" aria-labelledby="inactivity-title" aria-describedby="inactivity-message">
            <h2 id="inactivity-title" class="inactivity-title">Session expiring soon</h2>
            <p id="inactivity-message" class="inactivity-message">
                You will be logged out in <span id="inactivity-countdown">60</span>s due to inactivity.
            </p>
            <div class="inactivity-actions">
                <button id="inactivity-stay-btn" class="btn btn-primary" type="button">Stay signed in</button>
                <button id="inactivity-logout-btn" class="btn" type="button">Log out now</button>
            </div>
        </div>
    </div>

    <div id="custom-dialog" class="custom-dialog" hidden aria-modal="true" role="dialog">
        <div class="custom-dialog-sheet">
            <p class="custom-dialog-label" id="custom-dialog-label"></p>
            <input type="text" class="custom-dialog-input" id="custom-dialog-input" autocomplete="off">
            <div class="custom-dialog-extra" id="custom-dialog-extra" hidden>
                <div class="chip-row" id="custom-dialog-period" role="group" aria-label="How often">
                    <button type="button" class="chip active" data-period="day">Daily</button>
                    <button type="button" class="chip" data-period="week">Weekly</button>
                    <button type="button" class="chip" data-period="month">Monthly</button>
                    <button type="button" class="chip" data-period="year">Yearly</button>
                </div>
                <input type="number" class="custom-dialog-input" id="custom-dialog-target" min="1" max="1000" value="1" inputmode="numeric" aria-label="Target" hidden>
            </div>
            <div class="custom-dialog-actions">
                <button class="btn" id="custom-dialog-cancel" type="button">Cancel</button>
                <button class="btn btn-primary" id="custom-dialog-confirm" type="button">OK</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottom-nav">
        <button class="bottom-nav-btn active" data-mode="todos" onclick="switchMode('todos')">
            {{template "icon-tasks"}}
            <span>Tasks</span>
        </button>
        <button class="bottom-nav-btn" data-mode="notes" onclick="switchMode('notes')">
            {{template "icon-notes"}}
            <span>Notes</span>
        </button>
        <button class="bottom-nav-btn" data-mode="habits" onclick="switchMode('habits')">
            <span class="nav-btn-icon-wrap">
                {{template "icon-habits"}}
                <span class="nav-badge" id="habits-badge" hidden></span>
            </span>
            <span>Habits</span>
        </button>
    </nav>

    <script src="/static/htmx.min.js?v={{assetVersion}}"></script>
    <script src="/static/app.js?v={{assetVersion}}"></script>
    <script src="/static/workspace.js?v={{assetVersion}}"></script>
    <script src="/static/push.js?v={{assetVersion}}"></script>
</body>
</html>
