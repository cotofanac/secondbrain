{{if and (not .Notes) (not .Todos)}}
<div class="search-empty">No results for "{{.Query}}"</div>
{{else}}
{{if .Notes}}
<div class="search-section-label">Notes</div>
{{range .Notes}}
<button type="button" class="search-result-item" onclick="openNoteResult({{.ID}})">
    {{.Title}}
</button>
{{end}}
{{end}}
{{if .Todos}}
<div class="search-section-label">Tasks</div>
{{range .Todos}}
<button type="button" class="search-result-item" onclick="openTodoResult('{{.Category}}')">
    <span class="search-result-text">{{.Text}}</span>
    <span class="search-result-cat">{{.Category}}</span>
</button>
{{end}}
{{end}}
{{end}}
