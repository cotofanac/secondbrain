{{if and (not .Notes) (not .Todos) (not .Projects)}}
<div class="search-empty">No results for "{{.Query}}"</div>
{{else}}
{{if .Notes}}
<div class="search-section-label">Notes</div>
{{range .Notes}}
<button type="button" class="search-result-item" data-call="openNoteResult" data-args='[{{.ID}}]'>
    {{.Title}}
</button>
{{end}}
{{end}}
{{if .Todos}}
<div class="search-section-label">Tasks</div>
{{range .Todos}}
<button type="button" class="search-result-item" data-call="openTodoResult" data-args='["{{.Category}}",{{.ID}}]'>
    <span class="search-result-text">{{.Text}}</span>
    <span class="search-result-cat">{{if .Done}}completed{{else}}{{.Category}}{{end}}</span>
</button>
{{end}}
{{end}}
{{if .Projects}}<div class="search-section-label">Projects</div>{{range .Projects}}<button class="search-result-item" data-call="openProjectResult" data-args='[{{.ID}}]'>{{.Name}}</button>{{end}}{{end}}
{{end}}
