<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>SecondBrain &middot; Setup</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h1 class="login-title">Welcome</h1>
        <p class="login-subtitle">Create your first profile to get started.</p>
        <form action="/setup" method="post" hx-post="/setup" hx-target="body" class="login-form">
            <input type="text" name="name" placeholder="Profile name" maxlength="60"
                   autocomplete="off" class="setup-input" autofocus required>
            <input type="password" name="passcode" inputmode="numeric" pattern="\d{8}"
                   maxlength="8" placeholder="8-digit passcode" autocomplete="off"
                   class="passcode-input" required>
            <button type="submit" class="btn btn-primary setup-btn">Create profile</button>
            <div id="error" class="error-msg">{{if .}}{{.}}{{end}}</div>
        </form>
    </div>
    <script src="/static/htmx.min.js"></script>
</body>
</html>
