<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SecondBrain</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" href="/static/icon-192.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h1 class="login-title">SecondBrain</h1>
        <form action="/login" method="post" hx-post="/login" hx-target="body" class="login-form">
            <input type="password" name="passcode" inputmode="numeric" pattern="\d{8}"
                   maxlength="8" placeholder="• • • • • • • •" autocomplete="off"
                   class="passcode-input" autofocus required>
            <div id="error" class="error-msg">{{if .}}{{.}}{{end}}</div>
        </form>
    </div>
    <script>
        document.querySelector('.passcode-input').addEventListener('input', function() {
            if (this.value.length === 8) this.closest('form').requestSubmit();
        });
    </script>
    <script src="/static/htmx.min.js"></script>
</body>
</html>
