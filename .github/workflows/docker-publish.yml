name: Build and push Docker image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go tests
        run: go test ./...

      - name: Go static checks
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"

      - name: Client contract checks
        run: |
          node scripts/push-smoke.cjs
          node scripts/calendar-check.cjs

      # Browser checks run against a throwaway database. Playwright is pinned
      # and installed outside the repository; the app has no npm dependencies.
      - name: Browser smoke tests
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
          go build -o "$RUNNER_TEMP/secondbrain" .
          mkdir -p "$RUNNER_TEMP/data"
          PASSCODE=12345678 PORT=18080 DATA_DIR="$RUNNER_TEMP/data" "$RUNNER_TEMP/secondbrain" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:18080/health && break; sleep 1; done
          node scripts/ui-smoke.cjs
          node scripts/audit-smoke.cjs
          node scripts/lifecycle-smoke.cjs

      - name: Settled visual checks
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          TEST_BASE_URL: http://127.0.0.1:18082
          SCREENSHOT_DIR: ${{ runner.temp }}/visuals
        run: |
          DATA_DIR="$RUNNER_TEMP/visual-data" PASSCODE=12345678 PORT=18082 TZ=Europe/Bucharest BACKUP_KEEP=0 "$RUNNER_TEMP/secondbrain" > "$RUNNER_TEMP/visual-server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:18082/health && break; sleep 1; done
          node scripts/visual-check.cjs

      - name: Visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settled-layouts
          path: ${{ runner.temp }}/visuals
          if-no-files-found: ignore

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: |
          git fetch --tags
          release=$(git tag --points-at HEAD -l '[0-9]*.[0-9]*' | sort -V | tail -1)
          latest=$(git tag -l '[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -n "$release" ]; then
            next="$release"
          elif [ -z "$latest" ]; then
            next="1.0"
          else
            major=$(echo "$latest" | cut -d. -f1)
            minor=$(echo "$latest" | cut -d. -f2)
            next="${major}.$((minor + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      # Only the runtime stage's few RUN steps are emulated; the Go build
      # cross-compiles natively (see the Dockerfile).
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            havedreams/secondbrain:latest
            havedreams/secondbrain:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1 || git tag "$VERSION"
          git push origin "$VERSION"
