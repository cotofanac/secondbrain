name: Build and push Docker image

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Notification client checks
        run: node scripts/push-smoke.cjs

      # Browser checks run against a throwaway database. Playwright is installed
      # outside the repository; the app itself has no npm dependencies.
      - name: Browser smoke tests
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          go build -o "$RUNNER_TEMP/secondbrain" .
          mkdir -p "$RUNNER_TEMP/data"
          PASSCODE=12345678 PORT=18080 DATA_DIR="$RUNNER_TEMP/data" "$RUNNER_TEMP/secondbrain" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:18080/health && break; sleep 1; done
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright"
          node scripts/ui-smoke.cjs
          node scripts/audit-smoke.cjs

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

      - name: Bump patch version
        id: version
        run: |
          git fetch --tags
          release=$(git tag --points-at HEAD -l '[0-9]*.[0-9]*' | sort -V | tail -1)
          latest=$(git tag -l '[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -n "$release" ]; then
            next="$release"
          elif [ -z "$latest" ]; then
            next="1.0"
          else
            major=$(echo "$latest" | cut -d. -f1)
            minor=$(echo "$latest" | cut -d. -f2)
            next="${major}.$((minor + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            havedreams/secondbrain:latest
            havedreams/secondbrain:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1 || git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}
